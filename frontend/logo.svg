<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d9ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Q mark icon -->
  <circle cx="30" cy="30" r="26" fill="none" stroke="url(#grad)" stroke-width="3"/>
  <circle cx="30" cy="30" r="20" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="url(#grad)" text-anchor="middle">Q</text>
  <line x1="45" y1="48" x2="56" y2="58" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
  <!-- No. text -->
  <text x="72" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="1">No.</text>
  <text x="110" y="42" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#e2e8f0" letter-spacing="-1">Q</text>
