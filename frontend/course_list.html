    <main class="courses-page">
        <div class="page-header">
            <h1>کاوش همه دوره‌ها</h1>
            <p>در مجموعه‌ای منتخب از دوره‌های باکیفیت در تمام دسته‌بندی‌ها مرور کنید.</p>
        </div>
        <div class="courses-toolbar">
            <div class="search-inline">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="coursesSearchInput" placeholder="فیلتر دوره‌ها..." oninput="filterCourses()">
            </div>
            <select class="filter-select" id="categoryFilter" onchange="filterCourses()">
                <option value="all">همه دسته‌بندی‌ها</option>
            </select>
        </div>
        <div class="courses-list" id="coursesList"></div>
        <div class="no-results" id="noResults" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6"/></svg>
            <h3>دوره‌ای یافت نشد</h3>
            <p>جستجو یا فیلترهای خود را تغییر دهید.</p>
