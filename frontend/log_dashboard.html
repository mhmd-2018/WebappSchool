<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد لاگ‌های سیستم</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="dashboard-card">
    <div class="header" style="display:flex; align-items:center; justify-content:space-between;">
        <h1>🔐 لاگ‌های سیستم (فقط ادمین ارشد)</h1>
        <a class="btn btn-outline btn-sm" href="admin_dashboard.html">← بازگشت به پنل مدیریت</a>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>جستجوی لاگ‌ها</label>
            <input type="text" id="searchInput" placeholder="جستجوی پیام یا ثبت‌کننده...">
        </div>

        <div class="filter-group">
            <label>سطح لاگ</label>
            <select id="levelSelect">
                <option value="">همه سطوح</option>
                <option value="DEBUG">DEBUG</option>
                <option value="INFO">INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="ERROR">ERROR</option>
                <option value="CRITICAL">CRITICAL</option>
            </select>
        </div>

        <div class="filter-group" style="flex-direction: row;">
            <button onclick="filterLogTable()">اعمال فیلتر</button>
            <button class="clear" onclick="resetLogFilters()">پاک کردن</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>زمان</th>
                <th>سطح</th>
                <th>ثبت‌کننده</th>
                <th>پیام</th>
            </tr>
        </thead>
        <tbody id="logTableBody"></tbody>
    </table>

    <div class="empty-state" id="emptyState" style="display:none;">
        هیچ لاگی مطابق با فیلترهای شما یافت نشد.
    </div>

    <div class="pagination">
        <span id="logPaginationSummary">نمایش ۰ از ۰ مورد</span>
        <div class="pagination-buttons">
            <button id="logPrevBtn" disabled onclick="goToLogPage(currentLogPage - 1)">قبلی</button>
            <button id="logNextBtn" disabled onclick="goToLogPage(currentLogPage + 1)">بعدی</button>
        </div>
    </div>
</div>
    <script src="/static/scripts.js"></script>
</body>
</html>
