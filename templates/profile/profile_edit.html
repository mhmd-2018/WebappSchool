{% extends 'base.html' %}
{% block title %}ویرایش پروفایل | آسان آموز{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">ویرایش پروفایل</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">ذخیره</button>
            <a href="{% url 'profile:profile_detail' %}" class="btn btn-outline-secondary">انصراف</a>
        </form>
    </div>
</div>
{% endblock %}
