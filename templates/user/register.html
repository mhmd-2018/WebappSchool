{% extends 'base.html' %}
{% block title %}ثبت‌نام | آسان آموز{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">ساخت حساب کاربری جدید</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">ثبت‌نام</button>
        </form>
        <p class="mt-3 text-center">قبلا ثبت‌نام کرده‌اید؟ <a href="{% url 'user:login' %}">ورود</a></p>
    </div>
</div>
{% endblock %}
