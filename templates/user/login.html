{% extends 'base.html' %}
{% block title %}ورود | آسان آموز{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">ورود به حساب کاربری</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">ورود</button>
        </form>
        <p class="mt-3 text-center">حساب ندارید؟ <a href="{% url 'user:register' %}">ثبت‌نام کنید</a></p>
    </div>
</div>
{% endblock %}
